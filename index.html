<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixelcam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: één handheld-body — scherm boven, sluiter in het midden, draaiknoppen eronder. Single look (apparaat), werkt op beide host-thema's. */
:root{
  --body:#c4c7cc;      /* plastic behuizing */
  --body-dk:#a9adb3;   /* naden, groeven */
  --ink:#1b1c20;       /* opdruk */
  --screen:#0d0e10;    /* scherm */
  --hot:#b8125a;       /* sluiter */
  --hot-ink:#fff4f8;
  --f-label:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --f-body:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--body);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.dev{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--body-dk);padding-bottom:8px}
.brand{font-family:var(--f-label);font-size:18px;letter-spacing:.06em;margin:0}
.meta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bezel{background:var(--ink);padding:12px;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #2b2d33}
.screen{position:relative;background:var(--screen);display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;overflow:hidden}
#out{max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tag{position:absolute;left:8px;top:6px;font-family:var(--f-label);font-size:10px;color:#e9e9ea;letter-spacing:.08em;mix-blend-mode:difference}
.tag.rec{color:#fff;background:var(--hot);mix-blend-mode:normal;padding:1px 5px}
.tag.live::before{content:"";display:inline-block;width:7px;height:7px;background:var(--hot);margin-right:6px;vertical-align:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--body);color:var(--ink);
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;cursor:pointer;flex:1 1 auto;text-align:center;min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.btn.shut{background:var(--hot);color:var(--hot-ink);flex:2 1 auto}
.btn.rec::before{content:"";display:inline-block;width:10px;height:10px;background:var(--hot);border-radius:50%;margin-right:8px;vertical-align:0}
.btn.rec[aria-pressed=true]{background:var(--ink);color:var(--body)}
.btn.rec[aria-pressed=true]::before{border-radius:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.ctl{display:grid;gap:14px;border-top:2px solid var(--body-dk);padding-top:14px}
.c{display:grid;gap:6px}
.c .h{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.c .v{font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--hot);height:28px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-body);font-size:12px;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:6px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--body)}
.sw{display:inline-flex}.sw i{width:8px;height:12px;display:block}
.msg{font-size:12px;min-height:1.4em}
.hide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head><body>
<div class="dev">
  <div class="top">
    <h1 class="brand">PIXELCAM</h1>
    <span class="meta" id="res">—</span>
  </div>

  <div class="bezel">
    <div class="screen">
      <canvas id="out" aria-label="Gepixeld beeld"></canvas>
      <span class="tag" id="tag">VOORBEELD</span>
    </div>
  </div>

  <div class="row">
    <button class="btn shut" id="shut" type="button">Start camera</button>
    <input class="hide" type="file" id="cam" accept="image/*" capture="environment">
    <button class="btn" id="flip" type="button" disabled>Wissel</button>
  </div>
  <div class="row">
    <button class="btn rec" id="rec" type="button" aria-pressed="false" disabled>Opnemen</button>
    <button class="btn" id="savevid" type="button" hidden>Bewaar video</button>
  </div>
  <div class="row">
    <label class="btn" for="pick">Kies foto/video</label>
    <input class="hide" type="file" id="pick" accept="image/*,video/*">
    <button class="btn" id="save" type="button">Bewaar PNG</button>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <div class="ctl">
    <div class="c">
      <div class="h"><span>Pixelgrootte</span><span class="v" id="pxv"></span></div>
      <input type="range" id="px" min="2" max="40" value="10">
    </div>
    <div class="c">
      <div class="h"><span>Palet</span></div>
      <div class="seg" id="pal"></div>
    </div>
    <div class="c">
      <div class="h"><span>Kleurniveaus</span><span class="v" id="lvv"></span></div>
      <input type="range" id="lv" min="2" max="16" value="5">
    </div>
    <div class="c">
      <div class="h"><span>Dithering</span></div>
      <div class="seg" id="dith"></div>
    </div>
    <div class="c">
      <div class="h"><span>Raster</span></div>
      <div class="seg" id="grid"></div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const out=$("out"),octx=out.getContext("2d");
const small=document.createElement("canvas"),sctx=small.getContext("2d",{willReadFrequently:true});
const hex=h=>{h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const PALS={
  vrij:null,
  "4-tint groen":["#0f380f","#306230","#8bac0f","#9bbc0f"],
  "1-bit":["#000000","#ffffff"],
  "4-tint grijs":["#111111","#555555","#aaaaaa","#eeeeee"],
  cga:["#000000","#55ffff","#ff55ff","#ffffff"],
  nacht:["#0b0a12","#2a1f3d","#5a2d5e","#b8125a","#f2795a","#f5d7a1","#7ec4c1","#2e6f8e"],
};
const S={px:10,pal:"vrij",lv:5,dith:"bayer",grid:"uit",src:null,live:null,mirror:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("pixelcam")||"{}"),{src:null,live:null})}catch(e){}
const persist=()=>{try{localStorage.setItem("pixelcam",JSON.stringify({px:S.px,pal:S.pal,lv:S.lv,dith:S.dith,grid:S.grid}))}catch(e){}};
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16-.5);

function seg(el,opts,key,label){
  el.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");b.type="button";b.dataset.v=o;
    if(label)b.append(label(o));else b.textContent=o;
    b.onclick=()=>{S[key]=o;sync();draw();persist()};
    el.append(b);
  });
}
seg($("pal"),Object.keys(PALS),"pal",k=>{
  const f=document.createDocumentFragment();
  if(PALS[k]){const s=document.createElement("span");s.className="sw";PALS[k].slice(0,6).forEach(c=>{const i=document.createElement("i");i.style.background=c;s.append(i)});f.append(s)}
  f.append(k);return f;
});
seg($("dith"),["uit","bayer","ruis"],"dith");
seg($("grid"),["uit","lijnen","scanlines"],"grid");
function sync(){
  $("px").value=S.px;$("lv").value=S.lv;$("pxv").textContent=S.px+" px";
  $("lvv").textContent=S.pal==="vrij"?S.lv+" / kanaal":"n.v.t.";
  $("lv").disabled=S.pal!=="vrij";
  for(const [id,k] of [["pal","pal"],["dith","dith"],["grid","grid"]])
    for(const b of $(id).children)b.setAttribute("aria-pressed",b.dataset.v===S[k]);
}
$("px").oninput=e=>{S.px=+e.target.value;sync();draw();persist()};
$("lv").oninput=e=>{S.lv=+e.target.value;sync();draw();persist()};

// Voorbeeldscène zodat het scherm direct iets laat zien
function sample(){
  const c=document.createElement("canvas");c.width=960;c.height=720;const g=c.getContext("2d");
  const sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,"#1d2a5a");sky.addColorStop(.55,"#d4626a");sky.addColorStop(1,"#f6c27a");
  g.fillStyle=sky;g.fillRect(0,0,960,720);
  g.fillStyle="#ffe3a3";g.beginPath();g.arc(620,430,110,0,7);g.fill();
  for(let i=0;i<60;i++){g.fillStyle="rgba(255,255,255,"+(Math.random()*.8)+")";g.fillRect(Math.random()*960,Math.random()*260,2,2)}
  const ridge=(y,a,col,seed)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,720);for(let x=0;x<=960;x+=8)g.lineTo(x,y+Math.sin(x*.008+seed)*a+Math.sin(x*.023+seed*2)*a*.4);g.lineTo(960,720);g.fill()};
  ridge(470,40,"#5b3a6b",1);ridge(540,34,"#33264d",3);ridge(610,22,"#141630",5);
  g.fillStyle="#0a0b18";g.fillRect(120,520,26,140);g.fillRect(96,500,74,26);
  return c;
}

function draw(){
  const src=S.live||S.src;if(!src)return;
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw)return;
  const max=1080,k=Math.min(1,max/Math.max(sw,sh));
  const W=Math.round(sw*k),H=Math.round(sh*k);
  const w=Math.max(1,Math.round(W/S.px)),h=Math.max(1,Math.round(H/S.px));
  small.width=w;small.height=h;sctx.imageSmoothingEnabled=true;
  sctx.save();if(S.live&&S.mirror){sctx.translate(w,0);sctx.scale(-1,1)}sctx.drawImage(src,0,0,w,h);sctx.restore();
  const id=sctx.getImageData(0,0,w,h),d=id.data;
  const pal=PALS[S.pal]?PALS[S.pal].map(hex):null;
  const spread=pal?(255/Math.max(1,pal.length-1)):(255/(S.lv-1));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let t=0;if(S.dith==="bayer")t=B4[(y&3)*4+(x&3)];else if(S.dith==="ruis")t=Math.random()-.5;
    let r=d[i]+t*spread,g=d[i+1]+t*spread,b=d[i+2]+t*spread;
    if(pal){
      let best=0,bd=1e9;
      for(let p=0;p<pal.length;p++){const q=pal[p],dr=r-q[0],dg=g-q[1],db=b-q[2],dd=dr*dr*.3+dg*dg*.59+db*db*.11;if(dd<bd){bd=dd;best=p}}
      d[i]=pal[best][0];d[i+1]=pal[best][1];d[i+2]=pal[best][2];
    }else{
      const s=255/(S.lv-1),q=v=>Math.max(0,Math.min(255,Math.round(v/s)*s));
      d[i]=q(r);d[i+1]=q(g);d[i+2]=q(b);
    }
  }
  sctx.putImageData(id,0,0);
  const OW=rec?rec.W:(w*S.px)&~1,OH=rec?rec.H:(h*S.px)&~1;
  if(out.width!==OW)out.width=OW;if(out.height!==OH)out.height=OH;
  octx.imageSmoothingEnabled=false;octx.drawImage(small,0,0,OW,OH);
  const cx=OW/w,cy=OH/h;
  if(S.grid!=="uit"&&S.px>=4){
    octx.fillStyle="rgba(0,0,0,.28)";
    for(let y=0;y<h;y++)octx.fillRect(0,Math.round((y+1)*cy)-1,OW,S.grid==="scanlines"?Math.max(1,cy/3|0):1);
    if(S.grid==="lijnen")for(let x=0;x<w;x++)octx.fillRect(Math.round((x+1)*cx)-1,0,1,OH);
  }
  $("res").textContent=w+"×"+h+" PX";
}

function loadFile(f){
  if(!f)return;stopLive();
  if(f.type.startsWith("video/")){loadVideo(f);return}
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{S.src=img;$("tag").textContent="FOTO";$("tag").className="tag";draw();msg("")};
  img.onerror=()=>msg("Dit bestand kan niet als afbeelding worden geopend. Kies een JPG, PNG of HEIC.");
  img.src=url;
}
$("cam").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("pick").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
const msg=t=>$("msg").textContent=t;
function loop(){cancelAnimationFrame(raf);const f=()=>{draw();raf=requestAnimationFrame(f)};f()}
async function loadVideo(f){
  const v=document.createElement("video");v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute("playsinline","");
  v.src=URL.createObjectURL(f);
  try{await v.play()}catch(e){msg("Deze video kan hier niet worden afgespeeld. Probeer een MP4 of MOV.");return}
  S.live=v;S.mirror=false;$("tag").textContent="VIDEO";$("tag").className="tag live";$("shut").textContent="Maak foto";ui();loop();msg("Video speelt in een lus. Tik op Opnemen om de gefilterde versie op te slaan.");
}

// Live camera
let raf=0,stream=null,facing="environment",gotLive=false;
async function startLive(){
  if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext){noLive();return}
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},audio:false});
    const v=S.live||document.createElement("video");v.playsInline=true;v.muted=true;v.setAttribute("playsinline","");v.srcObject=stream;await v.play();
    const set=stream.getVideoTracks()[0]?.getSettings?.()||{};
    S.live=v;S.mirror=(set.facingMode||facing)==="user";gotLive=true;
    $("tag").textContent="LIVE";$("tag").className="tag live";$("shut").textContent="Maak foto";$("flip").disabled=false;
    ui();loop();msg("");
  }catch(e){
    if(e?.name==="NotAllowedError")msg("Camera-toegang geweigerd. Sta de camera toe in je browserinstellingen en tik opnieuw op ‘Start camera’.");
    else if(e?.name==="NotFoundError")msg("Geen camera gevonden op dit apparaat.");
    else noLive();
  }
}
function stopLive(){
  if(!S.live)return;if(rec)stopRec();cancelAnimationFrame(raf);S.live.pause?.();
  const v=S.live,c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
  const g=c.getContext("2d");if(S.mirror){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(v,0,0);
  stream?.getTracks().forEach(t=>t.stop());stream=null;
  S.src=c;S.live=null;S.mirror=false;$("tag").textContent="FOTO";$("tag").className="tag";
  $("shut").textContent="Start camera";ui();draw();
}
function noLive(){
  msg("Live beeld werkt hier niet (de pagina moet via https openen). ‘Start camera’ opent nu de fotocamera van je telefoon.");
  gotLive=false;$("shut").dataset.fallback="1";$("shut").textContent="Maak foto";
}
$("shut").onclick=()=>{
  if(S.live){stopLive();return}
  if($("shut").dataset.fallback){$("cam").click();return}
  startLive();
};
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";startLive()};
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(rec)stopRec();cancelAnimationFrame(raf)}else if(S.live)loop()});
function ui(){
  const cam=!!(S.live&&stream);
  $("flip").disabled=!cam||!!rec;
  $("rec").disabled=!S.live;
  $("shut").disabled=!!rec;$("pick").disabled=!!rec;
  $("rec").setAttribute("aria-pressed",!!rec);$("rec").textContent=rec?"Stop opname":"Opnemen";
}

// Video-opname van het gefilterde beeld
let rec=null,lastVid=null;
const MIMES=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
function startRec(){
  if(!S.live)return;
  if(!out.captureStream||!window.MediaRecorder){msg("Opnemen wordt in deze browser niet ondersteund. Gebruik Safari of Chrome.");return}
  const mime=MIMES.find(m=>MediaRecorder.isTypeSupported?.(m))||"";
  let mr;
  try{mr=new MediaRecorder(out.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:6e6}:{})}
  catch(e){msg("Opnemen lukt niet in deze browser.");return}
  const chunks=[],type=mr.mimeType||mime||"video/webm";
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    if(!chunks.length){msg("Opname is leeg. Probeer het opnieuw.");return}
    const sec=Math.round((performance.now()-t0)/1000);
    lastVid={blob:new Blob(chunks,{type}),ext:/mp4/.test(type)?"mp4":"webm"};
    $("savevid").hidden=false;$("savevid").textContent="Bewaar video ("+sec+" s)";
    msg("Opname klaar. Tik op ‘Bewaar video’.");
  };
  const t0=performance.now();
  rec={mr,W:out.width,H:out.height,t0,tag:$("tag").textContent,timer:setInterval(()=>{
    const s=(performance.now()-t0)/1000|0;$("tag").textContent="REC "+String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },250)};
  $("tag").className="tag rec";$("tag").textContent="REC 00:00";
  mr.start(1000);ui();msg("");
}
function stopRec(){
  if(!rec)return;const r=rec;rec=null;clearInterval(r.timer);
  try{r.mr.stop()}catch(e){}
  $("tag").textContent=r.tag;$("tag").className="tag live";ui();
}
$("rec").onclick=()=>rec?stopRec():startRec();
$("savevid").onclick=()=>{if(lastVid)saveBlob(lastVid.blob,"pixelcam-"+Date.now()+"."+lastVid.ext)};

// Bewaren: via Claude-viewer als die er is, anders gewone download
let dl=null;
(async()=>{try{dl=await window.claude?.use?.("downloads")}catch(e){dl=null}})();
$("save").onclick=()=>{
  if(S.live)draw();
  const name="pixelcam-"+Date.now()+".png";
  out.toBlob(b=>saveBlob(b,name),"image/png");
};
async function saveBlob(b,name){
  if(dl){
    try{await dl.save({filename:name,data:b});msg("Bewaard.")}
    catch(e){if(e?.code==="rate_limited")msg("Er staat al een opslagvraag open.");else if(e?.code!=="declined")msg("Opslaan is hier niet beschikbaar.")}
    return;
  }
  const f=new File([b],name,{type:b.type});
  if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e?.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);msg("Bewaard.");
}

S.src=sample();sync();draw();
})();
</script>

</body></html>
