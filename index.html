<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixelcam</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pixelcam">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: één handheld-body — scherm boven, sluiter in het midden, draaiknoppen eronder. Single look (apparaat), werkt op beide host-thema's. */
:root{
  --body:#c4c7cc;      /* plastic behuizing */
  --body-dk:#a9adb3;   /* naden, groeven */
  --ink:#1b1c20;       /* opdruk */
  --screen:#0d0e10;    /* scherm */
  --hot:#b8125a;       /* sluiter */
  --hot-ink:#fff4f8;
  --f-label:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --f-body:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--body);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.dev{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--body-dk);padding-bottom:8px}
.brand{font-family:var(--f-label);font-size:18px;letter-spacing:.06em;margin:0}
.meta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bezel{background:var(--ink);padding:12px;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #2b2d33}
.screen{position:relative;background:var(--screen);display:flex;justify-content:center;align-items:center;min-height:200px;max-width:100%;overflow:hidden}
#out{width:auto;height:auto;max-width:100%;max-height:70vh;max-height:70dvh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tag{position:absolute;left:8px;top:6px;font-family:var(--f-label);font-size:10px;color:#e9e9ea;letter-spacing:.08em;mix-blend-mode:difference}
.tag.rec{color:#fff;background:var(--hot);mix-blend-mode:normal;padding:1px 5px}
.tag.live::before{content:"";display:inline-block;width:7px;height:7px;background:var(--hot);margin-right:6px;vertical-align:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--body);color:var(--ink);
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;cursor:pointer;flex:1 1 auto;text-align:center;min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.btn.shut{background:var(--hot);color:var(--hot-ink);flex:2 1 auto}
.btn.rec::before{content:"";display:inline-block;width:10px;height:10px;background:var(--hot);border-radius:50%;margin-right:8px;vertical-align:0}
.btn.rec[aria-pressed=true]{background:var(--ink);color:var(--body)}
.btn.rec[aria-pressed=true]::before{border-radius:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.ctl{display:grid;gap:14px;border-top:2px solid var(--body-dk);padding-top:14px}
.c{display:grid;gap:6px}
.c .h{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.c .v{font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--hot);height:28px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-body);font-size:12px;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:6px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--body)}
.sw{display:inline-flex}.sw i{width:8px;height:12px;display:block}
.msg{font-size:12px;min-height:1.4em}
.hide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn.sm{min-height:36px;padding:7px 10px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.lvl{height:8px;border:2px solid var(--ink)}
.lvl i{display:block;height:100%;width:0;background:var(--hot)}
.ver{font-size:11px;letter-spacing:.06em;opacity:.75;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--body-dk);padding-top:10px}
@media (display-mode:standalone){body{padding-top:calc(16px + env(safe-area-inset-top,0px))}}
.fsbar,.fsname{display:none}
body.fs{overflow:hidden}
body.fs .screen{position:fixed;inset:0;z-index:50;min-height:0;background:#000;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.fs #out{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
body.fs .tag:not(.rec){display:none}
body.fs .fsbar{display:flex;position:absolute;left:0;right:0;bottom:0;gap:8px;flex-wrap:wrap;padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .2s}
body.fs.bar .fsbar{opacity:1;pointer-events:auto}
body.fs:not(.bar) .screen{cursor:none}
body.fs .fsname{display:block;position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--hot-ink);background:var(--hot);padding:3px 8px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
body.fs .fsname.show{opacity:1}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head><body>
<div class="dev">
  <div class="top">
    <h1 class="brand">PIXELCAM</h1>
    <span class="meta" id="res">—</span>
  </div>

  <div class="bezel">
    <div class="screen">
      <canvas id="out" aria-label="Gepixeld beeld"></canvas>
      <span class="tag" id="tag">VOORBEELD</span>
      <span class="fsname" id="fsname" aria-live="polite"></span>
      <div class="fsbar" id="fsbar">
        <button class="btn" id="fsprev" type="button">Vorige preset</button>
        <button class="btn" id="fsnext" type="button">Volgende preset</button>
        <button class="btn" id="fsrand" type="button">Willekeurig</button>
        <button class="btn rec" id="fsrec" type="button" aria-pressed="false">Opnemen</button>
        <button class="btn" id="fsexit" type="button">Sluit</button>
      </div>
    </div>
  </div>

  <div class="row">
    <button class="btn shut" id="shut" type="button">Start camera</button>
    <input class="hide" type="file" id="cam" accept="image/*" capture="environment">
    <button class="btn" id="flip" type="button" disabled>Wissel</button>
  </div>
  <div class="row">
    <button class="btn rec" id="rec" type="button" aria-pressed="false" disabled>Opnemen</button>
    <button class="btn" id="fs" type="button">Fullscreen</button>
    <button class="btn" id="savevid" type="button" hidden>Bewaar video</button>
  </div>
  <div class="row">
    <label class="btn" for="pick">Kies foto/video</label>
    <input class="hide" type="file" id="pick" accept="image/*,video/*">
    <button class="btn" id="save" type="button">Bewaar PNG</button>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <div class="ctl">
    <div class="c">
      <div class="h"><span>Presets</span><span class="v" id="prv"></span></div>
      <div class="seg" id="pre"></div>
      <div class="row"><button class="btn sm shut" id="prand" type="button">Willekeurig</button><button class="btn sm" id="psave" type="button">Bewaar huidige</button><button class="btn sm" id="pdel" type="button" disabled>Wis eigen preset</button></div>
    </div>
    <div class="c">
      <div class="h"><span>Pixelgrootte</span><span class="v" id="pxv"></span></div>
      <input type="range" id="px" min="2" max="40" value="10">
    </div>
    <div class="c">
      <div class="h"><span>Palet</span></div>
      <div class="seg" id="pal"></div>
    </div>
    <div class="c">
      <div class="h"><span>Kleurniveaus</span><span class="v" id="lvv"></span></div>
      <input type="range" id="lv" min="2" max="16" value="5">
    </div>
    <div class="c">
      <div class="h"><span>Dithering</span></div>
      <div class="seg" id="dith"></div>
    </div>
    <div class="c">
      <div class="h"><span>Raster</span></div>
      <div class="seg" id="grid"></div>
    </div>
    <div class="c">
      <div class="h"><span>Animaties</span><span class="v" id="anv"></span></div>
      <div class="seg" id="anim"></div>
    </div>
    <div class="c">
      <div class="h"><span>Reactie op beweging</span><span class="v" id="sev"></span></div>
      <input type="range" id="sens" min="0" max="10" value="5" aria-label="Gevoeligheid voor beweging">
    </div>
    <div class="c">
      <div class="h"><span>Reactie op muziek</span><span class="v" id="rev"></span></div>
      <input type="range" id="react" min="0" max="10" value="0" aria-label="Reactie op muziek via de microfoon">
      <div class="lvl" aria-hidden="true"><i id="lvl"></i></div>
    </div>
    <div class="c">
      <div class="h"><span>Geluid in opname</span></div>
      <div class="seg" id="recaud"></div>
    </div>
  </div>
  <div class="ver"><span id="ver"></span><span>Toetsen: F fullscreen · R opnemen · W willekeurig · ← → preset · 1–9</span></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const out=$("out"),octx=out.getContext("2d");
const small=document.createElement("canvas"),sctx=small.getContext("2d",{willReadFrequently:true});
const hex=h=>{h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const PALS={
  vrij:null,
  "4-tint groen":["#0f380f","#306230","#8bac0f","#9bbc0f"],
  "1-bit":["#000000","#ffffff"],
  "4-tint grijs":["#111111","#555555","#aaaaaa","#eeeeee"],
  cga:["#000000","#55ffff","#ff55ff","#ffffff"],
  nacht:["#0b0a12","#2a1f3d","#5a2d5e","#b8125a","#f2795a","#f5d7a1","#7ec4c1","#2e6f8e"],
};
const S={px:10,pal:"vrij",lv:5,dith:"bayer",grid:"uit",anim:["kat"],sens:5,react:0,recAudio:true,src:null,live:null,mirror:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("pixelcam")||"{}"),{src:null,live:null})}catch(e){}
const persist=()=>{try{localStorage.setItem("pixelcam",JSON.stringify({px:S.px,pal:S.pal,lv:S.lv,dith:S.dith,grid:S.grid,anim:S.anim,sens:S.sens,react:S.react,recAudio:S.recAudio}))}catch(e){}};
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16-.5);

function seg(el,opts,key,label){
  el.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");b.type="button";b.dataset.v=o;
    if(label)b.append(label(o));else b.textContent=o;
    b.onclick=()=>{S[key]=o;sync();draw();persist()};
    el.append(b);
  });
}
seg($("pal"),Object.keys(PALS),"pal",k=>{
  const f=document.createDocumentFragment();
  if(PALS[k]){const s=document.createElement("span");s.className="sw";PALS[k].slice(0,6).forEach(c=>{const i=document.createElement("i");i.style.background=c;s.append(i)});f.append(s)}
  f.append(k);return f;
});
seg($("dith"),["uit","bayer","ruis"],"dith");
seg($("grid"),["uit","lijnen","scanlines"],"grid");
const ANIMS=["kat","fiets","vogels","regen","fonkels","hartjes","glitch","hud","drones","data-regen"];
if(!Array.isArray(S.anim))S.anim=["kat"];S.anim=S.anim.filter(a=>ANIMS.includes(a));
ANIMS.forEach(a=>{
  const b=document.createElement("button");b.type="button";b.dataset.v=a;b.textContent=a;
  b.onclick=()=>{S.anim=S.anim.includes(a)?S.anim.filter(x=>x!==a):[...S.anim,a];persist();sync();ui();refreshLoop()};
  $("anim").append(b);
});
function sync(){
  $("px").value=S.px;$("lv").value=S.lv;$("pxv").textContent=S.px+" px";
  $("lvv").textContent=S.pal==="vrij"?S.lv+" / kanaal":"n.v.t.";
  $("lv").disabled=S.pal!=="vrij";
  for(const [id,k] of [["pal","pal"],["dith","dith"],["grid","grid"]])
    for(const b of $(id).children)b.setAttribute("aria-pressed",b.dataset.v===S[k]);
  for(const b of $("anim").children)b.setAttribute("aria-pressed",S.anim.includes(b.dataset.v));
  $("anv").textContent=S.anim.length?S.anim.length+" aan":"uit";
  $("sens").value=S.sens;$("sev").textContent=S.sens?S.sens+" / 10":"uit";
  $("react").value=S.react;$("rev").textContent=S.react?S.react+" / 10"+(AU.on?"":" · tik om mic te starten"):"uit";
  for(const b of $("recaud").children)b.setAttribute("aria-pressed",(b.dataset.v==="aan")===S.recAudio);
  const cp=curPreset();for(const b of $("pre").children)b.setAttribute("aria-pressed",allPresets()[+b.dataset.i]===cp);
  $("prv").textContent=cp?cp.n:"eigen mix";$("pdel").disabled=!(cp&&USER.includes(cp));
}
$("px").oninput=e=>{S.px=+e.target.value;sync();draw();persist()};
$("lv").oninput=e=>{S.lv=+e.target.value;sync();draw();persist()};
$("sens").oninput=e=>{S.sens=+e.target.value;sync();persist()};
$("react").oninput=e=>{S.react=+e.target.value;primeAudio();persist();updateMic()};

// Voorbeeldscène zodat het scherm direct iets laat zien
function sample(){
  const c=document.createElement("canvas");c.width=960;c.height=720;const g=c.getContext("2d");
  const sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,"#1d2a5a");sky.addColorStop(.55,"#d4626a");sky.addColorStop(1,"#f6c27a");
  g.fillStyle=sky;g.fillRect(0,0,960,720);
  g.fillStyle="#ffe3a3";g.beginPath();g.arc(620,430,110,0,7);g.fill();
  for(let i=0;i<60;i++){g.fillStyle="rgba(255,255,255,"+(Math.random()*.8)+")";g.fillRect(Math.random()*960,Math.random()*260,2,2)}
  const ridge=(y,a,col,seed)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,720);for(let x=0;x<=960;x+=8)g.lineTo(x,y+Math.sin(x*.008+seed)*a+Math.sin(x*.023+seed*2)*a*.4);g.lineTo(960,720);g.fill()};
  ridge(470,40,"#5b3a6b",1);ridge(540,34,"#33264d",3);ridge(610,22,"#141630",5);
  g.fillStyle="#0a0b18";g.fillRect(120,520,26,140);g.fillRect(96,500,74,26);
  return c;
}

function draw(){
  const src=S.live||S.src;if(!src)return;
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw)return;
  const max=1080,k=Math.min(1,max/Math.max(sw,sh));
  const W=Math.round(sw*k),H=Math.round(sh*k);
  const t=performance.now()/1000,dt=Math.min(.1,Math.max(0,t-lastT));lastT=t;fcount++;
  motion(src,!!S.live,q===0||fcount%(q+1)===0);
  audioTick(t,dt);
  FX.beat=AU.on?AU.pulse:0;FX.e=Math.max(M.amt,FX.beat*.7,AU.on?AU.lvl*.35:0);
  M.tp+=dt*(1+5*FX.e);
  const px=FX.beat>.05?Math.max(2,Math.round(S.px*(1+FX.beat*.6))):S.px;
  const w0=Math.max(1,Math.round(W/S.px)),h0=Math.max(1,Math.round(H/S.px));
  const w=Math.max(1,Math.round(W/px)),h=Math.max(1,Math.round(H/px));
  if(small.width!==w||small.height!==h){small.width=w;small.height=h}
  const key=[srcId,w,h,S.pal,S.lv,S.dith].join("|");
  const pal=PALS[S.pal]?PALS[S.pal].map(hex):null;
  let id;
  if(!S.live&&cache&&cache.key===key){id=new ImageData(new Uint8ClampedArray(cache.data),w,h)}
  else{
  sctx.imageSmoothingEnabled=true;
  sctx.save();if(S.live&&S.mirror){sctx.translate(w,0);sctx.scale(-1,1)}sctx.drawImage(src,0,0,w,h);sctx.restore();
  id=sctx.getImageData(0,0,w,h);const d=id.data;
  quantize(d,w,h,pal);
  if(!S.live)cache={key,data:new Uint8ClampedArray(d)};
  }
  if(S.anim.includes("glitch"))glitch(id.data,w,h,t);
  sctx.putImageData(id,0,0);
  sprites(sctx,t,w,h,pal);
  const OW=rec?rec.W:(w0*S.px)&~1,OH=rec?rec.H:(h0*S.px)&~1;
  if(out.width!==OW)out.width=OW;if(out.height!==OH)out.height=OH;
  octx.imageSmoothingEnabled=false;octx.drawImage(small,0,0,OW,OH);
  const cx=OW/w,cy=OH/h;
  if(S.grid!=="uit"&&S.px>=4){
    octx.fillStyle="rgba(0,0,0,.28)";
    for(let y=0;y<h;y++)octx.fillRect(0,Math.round((y+1)*cy)-1,OW,S.grid==="scanlines"?Math.max(1,cy/3|0):1);
    if(S.grid==="lijnen")for(let x=0;x<w;x++)octx.fillRect(Math.round((x+1)*cx)-1,0,1,OH);
  }
  if(S.anim.includes("hud"))hudText(octx,OW,OH,OW/w,OH/h,pal);
  $("res").textContent=w0+"×"+h0+" PX"+(S.live&&S.sens?" · BEW "+String(Math.round(M.amt*100)).padStart(2,"0")+"%":"")+(AU.on?" · BPM "+(AU.bpm||"--"):"")+(q?" · LITE":"");
  $("lvl").style.width=Math.round((AU.on?AU.lvl:0)*100)+"%";
}

function loadFile(f){
  if(!f)return;stopLive();
  if(f.type.startsWith("video/")){loadVideo(f);return}
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{setSrc(img);$("tag").textContent="FOTO";$("tag").className="tag";refreshLoop();msg("")};
  img.onerror=()=>msg("Dit bestand kan niet als afbeelding worden geopend. Kies een JPG, PNG of HEIC.");
  img.src=url;
}
$("cam").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("pick").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
const msg=t=>$("msg").textContent=t;
// Max 30 fps (camera levert er niet meer); bij traag toestel automatisch LITE (24 of 15 fps, minder bewegingsanalyse)
let lastT=0,fcount=0,q=0,lastDraw=0,ema=10,slow=0,fast=0,HI=null;
const QFPS=[30,24,15],FX={e:0,beat:0};
function loop(){
  cancelAnimationFrame(raf);
  const f=now=>{raf=requestAnimationFrame(f);
    if(now-lastDraw<1000/QFPS[q]-3)return;lastDraw=now;
    const a=performance.now();draw();ema+=(performance.now()-a-ema)*.1;
    if(ema>1000/QFPS[q]*.7){if(++slow>40&&q<2){q++;slow=0;fast=0}}else slow=Math.max(0,slow-1);
    if(q>0&&ema<1000/QFPS[q-1]*.35){if(++fast>90){q--;fast=0;slow=0}}else fast=0;
  };
  draw();raf=requestAnimationFrame(f);
}
async function loadVideo(f){
  const v=document.createElement("video");v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute("playsinline","");
  v.src=URL.createObjectURL(f);
  try{await v.play()}catch(e){msg("Deze video kan hier niet worden afgespeeld. Probeer een MP4 of MOV.");return}
  S.live=v;S.mirror=false;$("tag").textContent="VIDEO";$("tag").className="tag live";$("shut").textContent="Maak foto";ui();loop();msg("Video speelt in een lus. Tik op Opnemen om de gefilterde versie op te slaan.");
}

// Live camera
let raf=0,stream=null,facing="environment",gotLive=false;
async function startLive(){
  if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext){noLive();return}
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},audio:false});
    const v=S.live||document.createElement("video");v.playsInline=true;v.muted=true;v.setAttribute("playsinline","");v.srcObject=stream;await v.play();
    const set=stream.getVideoTracks()[0]?.getSettings?.()||{};
    S.live=v;S.mirror=(set.facingMode||facing)==="user";gotLive=true;
    $("tag").textContent="LIVE";$("tag").className="tag live";$("shut").textContent="Maak foto";$("flip").disabled=false;
    ui();loop();msg("");
  }catch(e){
    if(e?.name==="NotAllowedError")msg("Camera-toegang geweigerd. Sta de camera toe in je browserinstellingen en tik opnieuw op ‘Start camera’.");
    else if(e?.name==="NotFoundError")msg("Geen camera gevonden op dit apparaat.");
    else noLive();
  }
}
function stopLive(){
  if(!S.live)return;if(rec)stopRec();cancelAnimationFrame(raf);S.live.pause?.();
  const v=S.live,c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;

    for(let k=0;k<L;k++){
      const row=head-k,y=row*ch;if(y<-ch||y>h)continue;
      const b=Math.floor(rnd(c*97+row*13+Math.floor(t*(k?3:10)))*32768).toString(2).padStart(15,"0");
      g.globalAlpha=k?Math.min(1,Math.max(.15,1-k/L)*(1+FX.beat)):1;
      g.fillStyle=col(k?(mag?NEON.magenta:NEON.cyaan):NEON.wit,pal);glyph(g,b,c*cw,y,sc);
    }
  }
  g.globalAlpha=1;
}
function glitch(d,w,h,t){
  const s=Math.floor(t*10),a=FX.e;if(FX.beat<.5&&rnd(s)<.35-a*2)return;
  const bands=1+Math.floor(rnd(s+1)*4)+Math.floor(a*8);
  for(let b=0;b<bands;b++){
    const y0=rnd(s*7+b)*h|0,bh=1+Math.floor(rnd(s*3+b)*Math.max(2,h/12)),off=Math.round((rnd(s*5+b)-.5)*w*(.25+a*.6));
    for(let y=y0;y<Math.min(h,y0+bh);y++){
      const row=d.slice(y*w*4,(y+1)*w*4);
      for(let x=0;x<w;x++){const j=(((x-off)%w+w)%w)*4,i=(y*w+x)*4;d[i]=row[j];d[i+1]=row[j+1];d[i+2]=row[j+2]}
    }
  }
  if(rnd(s+9)<.5)for(let y=0;y<h;y++)for(let x=w-1;x>0;x--){const i=(y*w+x)*4;d[i]=d[i-4]}
}

// ---------- Kleurkwantisatie (snel: opzoektabellen i.p.v. per pixel zoeken) ----------
let LUTK="",LUT=null,PF=null,POSTK=-1,POST=null;
const NZ=new Float32Array(4096).map(()=>Math.random()-.5),NZS=new Int16Array(4096),BO=new Int16Array(16);
function quantize(d,w,h,pal){
  const spread=pal?(255/Math.max(1,pal.length-1)):(255/(S.lv-1)),by=S.dith==="bayer",nz=S.dith==="ruis";
  if(by)for(let i=0;i<16;i++)BO[i]=Math.round(B4[i]*spread);
  if(nz)for(let i=0;i<4096;i++)NZS[i]=Math.round(NZ[i]*spread);
  const no=(Math.random()*4096)|0;
  if(pal){
    if(LUTK!==S.pal){LUTK=S.pal;PF=new Uint8Array(pal.flat());LUT=new Uint8Array(32768);
      for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){const R=r*8+4,G=g*8+4,B=b*8+4;let best=0,bd=1e9;
        for(let p=0;p<pal.length;p++){const c=pal[p],dr=R-c[0],dg=G-c[1],db=B-c[2],dd=dr*dr*.3+dg*dg*.59+db*db*.11;if(dd<bd){bd=dd;best=p}}
        LUT[(r<<10)|(g<<5)|b]=best*3}}
    for(let y=0,i=0;y<h;y++){const yr=(y&3)<<2;for(let x=0;x<w;x++,i+=4){
      const o=by?BO[yr|(x&3)]:nz?NZS[((i>>2)+no)&4095]:0;
      let r=d[i]+o,g=d[i+1]+o,b=d[i+2]+o;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;
      const p=LUT[((r>>3)<<10)|((g>>3)<<5)|(b>>3)];d[i]=PF[p];d[i+1]=PF[p+1];d[i+2]=PF[p+2];
    }}
  }else{
    if(POSTK!==S.lv){POSTK=S.lv;POST=new Uint8Array(1024);const st=255/(S.lv-1);for(let v=0;v<1024;v++)POST[v]=Math.max(0,Math.min(255,Math.round((v-384)/st)*st))}
    for(let y=0,i=0;y<h;y++){const yr=(y&3)<<2;for(let x=0;x<w;x++,i+=4){
      const o=(by?BO[yr|(x&3)]:nz?NZS[((i>>2)+no)&4095]:0)+384;
      d[i]=POST[d[i]+o];d[i+1]=POST[d[i+1]+o];d[i+2]=POST[d[i+2]+o];
    }}
  }
}

// ---------- Geluid: microfoon voor opname en muziekreactie ----------
const AU={ctx:null,stream:null,an:null,fb:null,tb:null,on:false,lvl:0,pulse:0,avg:0,vr:0,pb:0,lastBeat:0,beats:[],bpm:0,pending:null};
function primeAudio(){try{if(!AU.ctx)AU.ctx=new (window.AudioContext||window.webkitAudioContext)();if(AU.ctx.state!=="running")AU.ctx.resume?.()}catch(e){}}
document.addEventListener("pointerdown",()=>{if(AU.ctx&&AU.ctx.state!=="running")AU.ctx.resume?.()},{passive:true});
function ensureMic(){
  if(AU.stream)return Promise.resolve(AU.stream);
  if(AU.pending)return AU.pending;
  if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext)return Promise.reject(Object.assign(new Error("geen mic"),{name:"NoMic"}));
  primeAudio();
  AU.pending=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false}).then(st=>{
    AU.stream=st;
    try{const src=AU.ctx.createMediaStreamSource(st);AU.an=AU.ctx.createAnalyser();AU.an.fftSize=1024;AU.an.smoothingTimeConstant=.2;
      const mute=AU.ctx.createGain();mute.gain.value=0;src.connect(AU.an);AU.an.connect(mute);mute.connect(AU.ctx.destination);
      AU.fb=new Uint8Array(AU.an.frequencyBinCount);AU.tb=new Uint8Array(AU.an.fftSize);AU.ctx.resume?.()}catch(e){AU.an=null}
    st.getAudioTracks()[0]?.addEventListener("ended",()=>{releaseMic();AU.on=false;sync();ui()});
    return st;
  }).finally(()=>{AU.pending=null});
  return AU.pending;
}
function releaseMic(){if(AU.stream)AU.stream.getTracks().forEach(t=>t.stop());AU.stream=null;AU.an=null;AU.lvl=0;AU.pulse=0;AU.bpm=0;AU.beats=[]}
async function updateMic(){
  const need=S.react>0||!!(rec&&rec.audio)||starting;
  if(need&&!AU.stream){try{await ensureMic();if(S.react>0)msg("")}catch(e){micFail(e);if(S.react>0){S.react=0;persist()}}}
  else if(!need&&AU.stream)releaseMic();
  AU.on=S.react>0&&!!AU.an;sync();ui();refreshLoop();
}
function micFail(e,inRec){
  msg((e?.name==="NotAllowedError"?"Microfoon-toegang geweigerd.":e?.name==="NotFoundError"?"Geen microfoon gevonden.":"Microfoon werkt hier niet (open de pagina via https).")+(inRec?" De opname gaat verder zonder geluid.":" Sta de microfoon toe en probeer opnieuw."));
}
// Niveau + beat (onset: plotselinge stijging in de bas t.o.v. vorig frame) + BPM uit de mediaan van de beat-intervallen
function audioTick(t,dt){
  if(!AU.on||!AU.an){AU.pulse=Math.max(0,AU.pulse-dt*3.5);AU.lvl*=.9;return}
  AU.an.getByteTimeDomainData(AU.tb);let e=0;for(let i=0;i<AU.tb.length;i++){const v=(AU.tb[i]-128)/128;e+=v*v}
  const rms=Math.sqrt(e/AU.tb.length);
  AU.an.getByteFrequencyData(AU.fb);const hz=AU.ctx.sampleRate/AU.an.fftSize,hi=Math.max(2,Math.round(160/hz));let b=0;for(let i=1;i<=hi;i++)b+=AU.fb[i];b/=hi*255;
  AU.lvl+=(Math.min(1,rms*(2+S.react*.6))-AU.lvl)*.3;
  const flux=Math.max(0,b-AU.pb);AU.pb=b;
  const thr=AU.avg+Math.sqrt(AU.vr)*(2.4-S.react*.12)+.04;
  AU.avg+=(flux-AU.avg)*.08;const dev=flux-AU.avg;AU.vr+=(dev*dev-AU.vr)*.08;
  AU.pulse=Math.max(0,AU.pulse-dt*3.5);
  if(flux>thr&&b>.2&&t-AU.lastBeat>.28){
    const iv=t-AU.lastBeat;AU.lastBeat=t;AU.pulse=1;
    if(iv<1.5){AU.beats.push(iv);if(AU.beats.length>12)AU.beats.shift();const so=[...AU.beats].sort((x,y)=>x-y);let bpm=60/so[so.length>>1];while(bpm<80)bpm*=2;while(bpm>180)bpm/=2;AU.bpm=Math.round(bpm)}
  }
  if(t-AU.lastBeat>4){AU.bpm=0;AU.beats=[]}
}
["aan","uit"].forEach(v=>{const b=document.createElement("button");b.type="button";b.dataset.v=v;b.textContent=v;b.onclick=()=>{S.recAudio=v==="aan";persist();sync()};$("recaud").append(b)});

// ---------- Presets ----------
const PRESETS=[
  {n:"Neon-nacht",px:6,pal:"vrij",lv:4,dith:"bayer",grid:"scanlines",anim:["hud","data-regen","drones"],sens:6,react:0},
  {n:"Gameboy",px:8,pal:"4-tint groen",lv:5,dith:"bayer",grid:"lijnen",anim:["kat"],sens:5,react:0},
  {n:"1-bit zine",px:5,pal:"1-bit",lv:5,dith:"bayer",grid:"uit",anim:["vogels"],sens:5,react:0},
  {n:"CGA arcade",px:8,pal:"cga",lv:5,dith:"uit",grid:"scanlines",anim:["fiets","glitch"],sens:5,react:0},
  {n:"Glitch-rave",px:10,pal:"vrij",lv:3,dith:"ruis",grid:"scanlines",anim:["glitch","data-regen","fonkels","hud"],sens:7,react:7},
  {n:"Zacht",px:14,pal:"nacht",lv:5,dith:"bayer",grid:"uit",anim:["hartjes","fonkels"],sens:4,react:0},
];
let USER=[];try{USER=JSON.parse(localStorage.getItem("pixelcam-presets")||"[]").filter(p=>p&&p.n&&Array.isArray(p.anim))}catch(e){}
const saveUser=()=>{try{localStorage.setItem("pixelcam-presets",JSON.stringify(USER))}catch(e){}};
const allPresets=()=>[...PRESETS,...USER];
const FIELDS=["px","pal","lv","dith","grid","sens","react"];
const same=p=>FIELDS.every(k=>p[k]===S[k])&&[...p.anim].sort().join()===[...S.anim].sort().join();
const curPreset=()=>allPresets().find(same);
function applyPreset(p){
  if(!p)return;FIELDS.forEach(k=>{if(p[k]!==undefined)S[k]=p[k]});S.anim=p.anim.filter(a=>ANIMS.includes(a));
  persist();ui();refreshLoop();updateMic();flashName(p.n);
}
function renderPresets(){
  const el=$("pre");el.innerHTML="";
  allPresets().forEach((p,i)=>{const b=document.createElement("button");b.type="button";b.dataset.i=i;b.textContent=p.n;b.onclick=()=>applyPreset(allPresets()[i]);el.append(b)});
  sync();
}
$("psave").onclick=()=>{
  const c=curPreset();if(c){msg("Deze instellingen staan al als preset ‘"+c.n+"’.");return}
  if(USER.length>=9){msg("Maximaal 9 eigen presets. Wis er eerst een.");return}
  let n=1;while(USER.some(p=>p.n==="Eigen "+n))n++;
  const p={n:"Eigen "+n,anim:[...S.anim]};FIELDS.forEach(k=>p[k]=S[k]);
  USER.push(p);saveUser();renderPresets();msg("Bewaard als ‘"+p.n+"’.");
};
$("pdel").onclick=()=>{const p=curPreset(),i=USER.indexOf(p);if(i<0)return;USER.splice(i,1);saveUser();renderPresets();msg("‘"+p.n+"’ gewist.")};
let nameT=0;function flashName(n){const e=$("fsname");e.textContent=n;e.classList.add("show");clearTimeout(nameT);nameT=setTimeout(()=>e.classList.remove("show"),1400)}
// Willekeurige mix: pixelgrootte, palet, kleurniveaus, dithering, raster en 1–3 animaties (muziekreactie blijft zoals hij staat)
function randomize(){
  const pick=a=>a[Math.random()*a.length|0],before=JSON.stringify([S.px,S.pal,S.lv,S.dith,S.grid,S.anim]);
  for(let i=0;i<5;i++){
    S.px=pick([4,5,6,8,10,12,14,16]);S.pal=pick(Object.keys(PALS));S.lv=2+(Math.random()*5|0);
    S.dith=pick(["uit","bayer","ruis"]);S.grid=pick(["uit","lijnen","scanlines"]);
    S.anim=[...ANIMS].sort(()=>Math.random()-.5).slice(0,1+(Math.random()*3|0));
    if(JSON.stringify([S.px,S.pal,S.lv,S.dith,S.grid,S.anim])!==before)break;
  }
  persist();sync();ui();refreshLoop();flashName("Willekeurig");msg("Willekeurige mix. Bevalt hij? Tik op ‘Bewaar huidige’.");
}
$("prand").onclick=randomize;$("fsrand").onclick=()=>{randomize();showBar()};
function stepPreset(d){const L=allPresets(),c=curPreset();let i=c?L.indexOf(c):(d>0?-1:0);i=((i+d)%L.length+L.length)%L.length;applyPreset(L[i])}

// ---------- Fullscreen live-modus ----------
let wake=null,barT=0;
const isFs=()=>document.body.classList.contains("fs");
async function lockWake(){try{wake=await navigator.wakeLock?.request("screen")}catch(e){wake=null}}
function showBar(){document.body.classList.add("bar");clearTimeout(barT);barT=setTimeout(()=>document.body.classList.remove("bar"),3000)}
async function enterFs(){
  document.body.classList.add("fs");showBar();
  const el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen;
  try{if(r)await r.call(el)}catch(e){}
  lockWake();
}
function exitFs(){
  document.body.classList.remove("fs","bar");
  if(document.fullscreenElement||document.webkitFullscreenElement){try{const x=(document.exitFullscreen||document.webkitExitFullscreen).call(document);x?.catch?.(()=>{})}catch(e){}}
  try{wake?.release?.()}catch(e){}wake=null;
}
const fsToggle=()=>isFs()?exitFs():enterFs();
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&isFs())exitFs()});
document.addEventListener("webkitfullscreenchange",()=>{if(!document.webkitFullscreenElement&&isFs())exitFs()});
$("fs").onclick=enterFs;$("fsexit").onclick=exitFs;
$("fsnext").onclick=()=>{stepPreset(1);showBar()};$("fsprev").onclick=()=>{stepPreset(-1);showBar()};
$("fsrec").onclick=()=>{rec?stopRec():startRec();showBar()};
document.querySelector(".screen").addEventListener("click",e=>{if(!isFs()||e.target.closest(".fsbar"))return;document.body.classList.contains("bar")?document.body.classList.remove("bar"):showBar()});
document.addEventListener("pointermove",e=>{if(isFs()&&e.pointerType==="mouse")showBar()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&isFs())lockWake()});

// ---------- Toetsen (laptop / live-set) ----------
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tg=e.target,k=e.key;
  if(tg&&tg.tagName==="BUTTON"&&(k===" "||k==="Enter"))return;
  if(k==="f"||k==="F"){fsToggle();e.preventDefault()}
  else if(k==="Escape"){if(isFs())exitFs()}
  else if(k==="w"||k==="W"){randomize()}
  else if(k==="r"||k==="R"){if(!$("rec").disabled){rec?stopRec():startRec()}}
  else if(tg&&tg.type==="range")return;
  else if(k==="ArrowRight"||k===" "){stepPreset(1);e.preventDefault()}
  else if(k==="ArrowLeft"){stepPreset(-1);e.preventDefault()}
  else if(/^[1-9]$/.test(k))applyPreset(allPresets()[+k-1]);
});

const VERSION="v8";$("ver").textContent="Pixelcam "+VERSION;
// Muziekreactie stond nog aan van vorige keer: mic pas starten na een tik (geen ongevraagde mic-vraag bij openen)
if(S.react>0)document.addEventListener("pointerdown",()=>{primeAudio();updateMic()},{once:true});
setSrc(sample());renderPresets();ui();refreshLoop();
})();
</script>
